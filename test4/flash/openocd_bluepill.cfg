# ============================================================================
#  STM32F103C8T6 (Blue Pill / 最小系统板) + ST-Link V2(克隆)  SWD 烧录配置
#  OpenOCD 纯 SWD 读写，不做 ST 正版校验 → 克隆仿真器/克隆芯片都能烧。
#  接线(4 线, 不需 NRST)：
#     ST-Link SWDIO --> 板子 PA13
#     ST-Link SWCLK --> 板子 PA14
#     ST-Link GND   --> 板子 GND    (必须共地)
#     ST-Link 3.3V  --> 板子 3V3    (仅给 MCU，别用这个去带舵机)
#  用法见 flash/flash.ps1 与 flash/probe.ps1
# ============================================================================

# --- 仿真器接口：ST-Link V2（克隆也认） ---
source [find interface/stlink.cfg]

# 新版 OpenOCD(0.11+) 的 ST-Link 用原生 st-link 驱动，走 SWD 传输
transport select swd

# 普通 ST-Link V2 建议 1000kHz，稳妥可靠；克隆棒若太旧降到 500~1000
adapter speed 1000

# --- 芯片目标：STM32F1 系列 ---
# F103C8 = 64KB Flash / 20KB RAM。给 OpenOCD 明确 flash 大小 + 一块 RAM 作缓存
set WORKAREASIZE 0x2000     ;# 8KB RAM 作编程缓存
set FLASH_SIZE   0x10000    ;# 64KB

source [find target/stm32f1x.cfg]

# 蓝丸上复位引脚(NRST)通常没接到克隆 ST-Link，故不配 srst；
# 统一用 OpenOCD 的软件复位(DAP)完成 halt/reset，不依赖 NRST 线。
# 若你的克隆棒把 NRST 也连到了 PA 复位脚，可取消下行注释改成 srst_only。
# reset_config srst_only
