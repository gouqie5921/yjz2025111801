# ============================================================================
#  dump_live.cfg - read the running firmware's state over SWD, no serial needed
#
#  OpenOCD's "mdw" printed nothing in this build, so we dump regions to files
#  and decode them on the PC side instead.
#
#  Usage:
#    openocd -s <scripts> -f flash\openocd_bluepill.cfg -f flash\dump_live.cfg
#
#  NOTE: keep this file pure ASCII.
#  The s_st address comes from: arm-none-eabi-nm build\cli\master.elf | findstr s_st
# ============================================================================

adapter speed 500
init

# hold the target in reset, release it so the firmware re-initialises, then halt
reset halt
resume
sleep 3000
halt

# app_state_t of the master firmware
dump_image D:/Projecttest/test5/master/build/cli/_s_st.bin 0x20000890 0x40

# RCC_APB2ENR / RCC_APB1ENR tell us WHICH firmware is running:
#   master -> ADC1EN(bit9) set, TIM3EN clear
#   slave  -> TIM3EN(bit1) set, ADC1EN clear
dump_image D:/Projecttest/test5/master/build/cli/_rcc.bin 0x40021000 0x40

# ADC1/ADC2 data registers (DR at +0x4C) = the two pot readings
dump_image D:/Projecttest/test5/master/build/cli/_adc1.bin 0x40012400 0x50
dump_image D:/Projecttest/test5/master/build/cli/_adc2.bin 0x40012800 0x50

# USART1 (HC-05) and USART2 (debug) BRR/CR1 = baud rate and enable bits
dump_image D:/Projecttest/test5/master/build/cli/_u1.bin 0x40013800 0x20
dump_image D:/Projecttest/test5/master/build/cli/_u2.bin 0x40004400 0x20

# I2C1 (MPU6050) state: SR1/SR2 show BUSY / ACK-fail, CCR shows the timing setup
dump_image D:/Projecttest/test5/master/build/cli/_i2c.bin 0x40005400 0x24

# GPIO config + actual pin levels; PB6/PB7 IDR bits show the real I2C bus levels
dump_image D:/Projecttest/test5/master/build/cli/_gpioa.bin 0x40010800 0x20
dump_image D:/Projecttest/test5/master/build/cli/_gpiob.bin 0x40010C00 0x20

# APP_HW_PROBE=1 build only: pin probe + I2C scan results
#   +0x00 line_pulldown[2]  +0x02 line_pullup[2]
#   +0x04 pot_pulldown[2]   +0x06 pot_pullup[2]
#   +0x08 addr69_ok +0x09 addr68_ok  +0x0C err(u32) +0x10 found +0x11 scan[14]
dump_image D:/Projecttest/test5/master/build/cli/_probe.bin 0x20000900 0x20

resume
exit
